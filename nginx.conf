# nginx serving the static Familienbarometer site on an unprivileged port
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Bound how long a client may hold a connection / how large a request may be.
    # Static site: no uploads, so keep request bodies and slow handshakes tight.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     65s;
    client_max_body_size  1m;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        server_tokens off;
        port_in_redirect off;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

        # --- Security headers ---
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://tagmanager.google.com https://*.google-analytics.com https://www.googleadservices.com https://www.google.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://connect.facebook.net https://snap.licdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com https://www.facebook.com https://px.ads.linkedin.com; connect-src 'self' https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.g.doubleclick.net https://www.google.com https://connect.facebook.net https://px.ads.linkedin.com; frame-src https://www.googletagmanager.com https://td.doubleclick.net; worker-src 'self'; manifest-src 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;

        # Sitemap / metadata files: no cache, correct Content-Type
        location ~* ^/sitemap.*\.xml$ {
            try_files $uri =404;
            access_log off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            types { application/xml xml; }
        }

        location ~* ^/(robots\.txt|site\.webmanifest)$ {
            try_files $uri =404;
            access_log off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location ^~ /.well-known/ {
            try_files $uri =404;
            access_log off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # HTML: never cache
        location ~* \.html$ {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Content-hashed static assets: cache aggressively
        location ~* \.(?:css|js|json|svg|png|jpe?g|gif|ico|map|woff2?|ttf|eot|pdf|zip)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Static site: serve the file, then the directory index, then 404
        location / {
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /404.html;
        location = /404.html { internal; }

        # Deny dotfiles
        location ~ /\. {
            deny all;
        }
    }
}
